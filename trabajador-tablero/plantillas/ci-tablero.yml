# Plantilla del workflow "CI tablero": se copia tal cual a AlexMoreR/Gestion y AlexMoreR/messenger-basic
# (en .github/workflows/). En esos repos se quitan los pasos de Prisma o Lint si no existen.
name: CI tablero

# Revisa cada rama tablero/* que sube el Coordinador: tipos, lint, build y pruebas.
# El Coordinador clasifica el error por el NOMBRE del paso que falla: "Lint" = lint,
# "Pruebas" = pruebas que fallan y cualquier otro = no compila. No renombrar a la ligera.
# Corre SOLO en las ramas tablero/* (y a mano): en main la revisión no aplica y el despliegue es docker-image.yml.
# El Coordinador, al subir a main, solo mira el workflow de subida.workflowDespliegue, no este.
on:
  push:
    branches: ['tablero/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tablero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Direcciones de mentira a propósito (las mismas de entornoSeguro() en etapas.mjs). Sin secretos.
      DATABASE_URL: postgresql://trabajador:no-usar@127.0.0.1:1/no_usar
      DIRECT_URL: postgresql://trabajador:no-usar@127.0.0.1:1/no_usar
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4
        with:
          # Historia completa: el paso Lint compara la rama con su base (merge-base).
          fetch-depth: 0

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache de Next
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            next-${{ runner.os }}-

      - name: Instalar
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Tipos tsc
        run: npx tsc --noEmit

      # Solo los archivos que cambió la rama respecto de main (igual que la regla del Coordinador "sin errores nuevos"):
      # los errores de lint viejos del repo no frenan la rama. Sin archivos .ts/.tsx/.js/.mjs cambiados, el paso pasa.
      - name: Lint
        env:
          RAMA_BASE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "$RAMA_BASE"
          base="$(git merge-base "origin/$RAMA_BASE" HEAD || echo "origin/$RAMA_BASE")"
          archivos=()
          while IFS= read -r archivo; do
            if [ -f "$archivo" ]; then archivos+=("$archivo"); fi
          done < <(git diff --name-only --diff-filter=d "$base" HEAD -- '*.ts' '*.tsx' '*.js' '*.mjs')
          if [ "${#archivos[@]}" -eq 0 ]; then
            echo "La rama no cambió archivos .ts/.tsx/.js/.mjs respecto de $RAMA_BASE: nada que revisar."
            exit 0
          fi
          echo "Lint de ${#archivos[@]} archivo(s) cambiados respecto de $RAMA_BASE:"
          printf '  %s\n' "${archivos[@]}"
          npx eslint --no-warn-ignored -- "${archivos[@]}"

      - name: Build
        run: npm run build

      - name: Pruebas
        run: node scripts/correr-pruebas-ci.mjs
