name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Dos pushes seguidos a main corrian dos builds a la vez y el que terminaba ULTIMO quedaba en
# produccion como :latest, aunque fuera el commit viejo (20-oct-2026: bc22ad5e quedo tapado por
# c23715a9). Con esto un push nuevo cancela el build anterior y siempre gana el commit mas nuevo.
concurrency:
  group: docker-image-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DEPLOYMENT_ID=${{ github.sha }}
            NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          tags: ghcr.io/alexmorer/agentelite:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Despliegue (desde el 2-nov-2026, servidor de Estados Unidos): aqui no se avisa a nadie. El servidor
      # corre /opt/crm/actualizar.sh cada minuto, baja ghcr.io/alexmorer/agentelite:latest y, si cambio,
      # prende la app nueva al lado de la vieja y apaga la vieja cuando esta sana. El CRM de Estados Unidos
      # NO es un stack de Portainer (corre con docker compose), asi que no hay webhook. Antes este paso
      # avisaba al Portainer del servidor de Francia (secreto PORTAINER_AGENTELITE), donde el CRM ya no corre.
