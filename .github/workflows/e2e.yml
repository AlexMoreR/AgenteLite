name: E2E nocturno

# Pruebas E2E de SOLO lectura contra produccion (asesora en celular).
# No se dispara en push: no interfiere con el despliegue (docker-image.yml) ni despliega nada.
on:
  schedule:
    - cron: "0 8 * * *" # 3:00 a. m. hora Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-nocturno
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://app.aizenbot.com' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Avisar si faltan secretos
        if: env.E2E_EMAIL == '' || env.E2E_PASSWORD == ''
        run: |
          echo "::warning::Faltan los secretos E2E_EMAIL / E2E_PASSWORD. Las pruebas E2E se saltan."
          echo "Faltan los secretos E2E_EMAIL / E2E_PASSWORD: las pruebas E2E se saltaron." >> "$GITHUB_STEP_SUMMARY"

      # --ignore-scripts: no hace falta Prisma ni Next para correr Playwright.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E
        run: npx playwright test -c e2e --project=movil

      - name: Resumen de tiempos
        if: always()
        run: |
          if [ -f e2e-results/tiempos.json ]; then
            {
              echo "### Tiempos E2E"
              echo '```json'
              cat e2e-results/tiempos.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            e2e-results/tiempos.json
            e2e-results/reporte-html/
            e2e-results/artefactos/
          if-no-files-found: warn
          retention-days: 14
