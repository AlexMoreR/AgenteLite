services:
  aizenbot_app:
    image: ghcr.io/alexmorer/agentelite:latest
    volumes:
      - aizenbot_uploads:/app/public/uploads
      # Audios de las Reuniones: privado (fuera de public/), lo comparte con livekit_egress.
      - aizenbot_reuniones:/app/reuniones
    environment:
      NODE_ENV: "production"
      BACKEND_ENV: "https://app.aizenbot.com"
      AUTH_URL: "https://app.aizenbot.com"
      NEXTAUTH_URL: "https://app.aizenbot.com"
      NEXT_PUBLIC_SITE_URL: "https://app.aizenbot.com"
      DATABASE_URL: "${DATABASE_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      FOLLOW_CRON_SECRET: "${FOLLOW_CRON_SECRET}"
      EVOLUTION_WEBHOOK_SECRET: "${EVOLUTION_WEBHOOK_SECRET}"
      PRISMA_AUTO_RESOLVE_FAILED_OFFICIAL_API_MIGRATION: "true"
      # Reuniones: el servidor de video. Si LiveKit se muda a otro VPS, solo cambian estas tres.
      LIVEKIT_URL: "wss://video.magilus.com"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      REUNIONES_CARPETA: "/app/reuniones"
      LIVEKIT_EGRESS_CARPETA: "/out"
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.aizenbot.rule=Host(`app.aizenbot.com`)
        - traefik.http.routers.aizenbot.entrypoints=websecure
        - traefik.http.routers.aizenbot.tls=true
        - traefik.http.routers.aizenbot.tls.certresolver=letsencryptresolver
        - traefik.http.routers.aizenbot.service=aizenbot
        - traefik.http.services.aizenbot.loadbalancer.server.port=3000
        - traefik.http.services.aizenbot.loadbalancer.passHostHeader=true

  aizenbot_follow_cron:
    image: curlimages/curl:8.11.1
    environment:
      FOLLOW_CRON_SECRET: "${FOLLOW_CRON_SECRET}"
      EVOLUTION_WEBHOOK_SECRET: "${EVOLUTION_WEBHOOK_SECRET}"
    command:
      - sh
      - -lc
      - |
        while true; do
          SECRET="$$FOLLOW_CRON_SECRET"
          if [ -z "$$SECRET" ]; then
            SECRET="$$EVOLUTION_WEBHOOK_SECRET"
          fi
          if [ -n "$$SECRET" ]; then
            echo "[follow-cron] calling /api/cron/follows with secret"
            curl -sS -X POST \
              -H "x-follow-cron-secret: $$SECRET" \
              -o /tmp/follow-cron.body \
              -w "[follow-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/follows || true
          else
            echo "[follow-cron] calling /api/cron/follows without secret"
            curl -sS -X POST \
              -o /tmp/follow-cron.body \
              -w "[follow-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/follows || true
          fi
          if [ -f /tmp/follow-cron.body ]; then
            echo "[follow-cron] body:"
            cat /tmp/follow-cron.body
            rm -f /tmp/follow-cron.body
          fi
          sleep 60
        done
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  aizenbot_daily_report_cron:
    image: curlimages/curl:8.11.1
    environment:
      DAILY_REPORT_CRON_SECRET: "${DAILY_REPORT_CRON_SECRET}"
      FOLLOW_CRON_SECRET: "${FOLLOW_CRON_SECRET}"
    command:
      - sh
      - -lc
      - |
        while true; do
          SECRET="$$DAILY_REPORT_CRON_SECRET"
          if [ -z "$$SECRET" ]; then
            SECRET="$$FOLLOW_CRON_SECRET"
          fi
          if [ -n "$$SECRET" ]; then
            echo "[daily-report-cron] calling /api/cron/daily-report with secret"
            curl -sS -X POST \
              -H "x-daily-report-secret: $$SECRET" \
              -o /tmp/daily-report.body \
              -w "[daily-report-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/daily-report || true
          else
            echo "[daily-report-cron] calling /api/cron/daily-report without secret"
            curl -sS -X POST \
              -o /tmp/daily-report.body \
              -w "[daily-report-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/daily-report || true
          fi
          if [ -f /tmp/daily-report.body ]; then
            echo "[daily-report-cron] body:"
            cat /tmp/daily-report.body
            rm -f /tmp/daily-report.body
          fi
          sleep 60
        done
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # Respaldo nocturno de la base a Google Drive (docker/respaldo/respaldo.sh, ver README). Misma imagen
  # que la app: mira la hora cada minuto y a las 2:00 a. m. de Colombia copia la base (solo lee), la sube
  # a Drive en Respaldos/AizenCRM y borra alli las de mas de 30 dias. Si falla, correo a RESPALDO_AVISO_A.
  aizenbot_respaldo:
    image: ghcr.io/alexmorer/agentelite:latest
    volumes:
      - aizenbot_respaldos:/respaldos
    environment:
      RESPALDO_DATABASE_URL: "${RESPALDO_DATABASE_URL}"
      RESPALDO_AVISO_A: "${RESPALDO_AVISO_A}"
      RCLONE_CONFIG_DRIVE_TYPE: "drive"
      RCLONE_CONFIG_DRIVE_SCOPE: "drive.file"
      RCLONE_CONFIG_DRIVE_TOKEN: "${RCLONE_CONFIG_DRIVE_TOKEN}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
    command: ["sh", "./docker/respaldo/respaldo.sh", "reloj"]
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ── Reuniones: LiveKit (video), Egress (graba solo el audio de cada persona) y Redis ──────────────
  # La configuración se lee mejor en docker/livekit/*.yaml; acá va copiada para que Portainer ponga las
  # claves. Si cambias una, cambia la otra.
  #
  # Antes de prenderlo, a mano en el VPS: abrir 7881/TCP, 3478/UDP y 50000-50200/UDP en el firewall, y
  # crear los DNS video.magilus.com y turn.magilus.com apuntando a 31.220.82.79. Variables de Portainer:
  # LIVEKIT_API_KEY y LIVEKIT_API_SECRET (el secreto, de 32 caracteres o más).
  livekit:
    image: livekit/livekit-server:v1.13.0
    # livekit-server lee la configuración de LIVEKIT_CONFIG y las claves de LIVEKIT_KEYS.
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 50000
          use_external_ip: true
        redis:
          address: livekit_redis:6379
        turn:
          enabled: true
          domain: turn.magilus.com
          tls_port: 5349
          udp_port: 3478
          external_tls: true
        room:
          empty_timeout: 600
          departure_timeout: 600
          max_participants: 12
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://app.aizenbot.com/api/reuniones/livekit
        logging:
          level: info
    # El audio y el video van DIRECTO al servidor (no por Traefik): en Swarm, mode: host.
    ports:
      - target: 7881
        published: 7881
        protocol: tcp
        mode: host
      - target: 3478
        published: 3478
        protocol: udp
        mode: host
      - target: 50000
        published: 50000
        protocol: udp
        mode: host
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        # Solo la señalización (wss) pasa por Traefik.
        - traefik.http.routers.livekit.rule=Host(`video.magilus.com`)
        - traefik.http.routers.livekit.entrypoints=websecure
        - traefik.http.routers.livekit.tls=true
        - traefik.http.routers.livekit.tls.certresolver=letsencryptresolver
        - traefik.http.routers.livekit.service=livekit
        - traefik.http.services.livekit.loadbalancer.server.port=7880
        # TURN por TLS en el 443: Traefik termina el TLS y pasa el TCP al 5349 de LiveKit.
        - traefik.tcp.routers.livekit-turn.rule=HostSNI(`turn.magilus.com`)
        - traefik.tcp.routers.livekit-turn.entrypoints=websecure
        - traefik.tcp.routers.livekit-turn.tls=true
        - traefik.tcp.routers.livekit-turn.tls.certresolver=letsencryptresolver
        - traefik.tcp.routers.livekit-turn.service=livekit-turn
        - traefik.tcp.services.livekit-turn.loadbalancer.server.port=5349

  livekit_egress:
    image: livekit/egress:v1.15.0
    # Mismo usuario que el CRM (root: la imagen del CRM no tiene USER), así los dos leen y escriben el volumen.
    user: "0:0"
    volumes:
      - aizenbot_reuniones:/out
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: livekit_redis:6379
        health_port: 8080
        log_level: info
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  livekit_redis:
    image: redis:7-alpine
    # Solo coordina LiveKit con Egress: no guarda nada que haga falta conservar.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  minha_rede:
    external: true

volumes:
  aizenbot_uploads:
  aizenbot_respaldos:
  aizenbot_reuniones:
