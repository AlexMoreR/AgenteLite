services:
  aizenbot_app:
    image: ghcr.io/alexmorer/agentelite:latest
    volumes:
      - aizenbot_uploads:/app/public/uploads
    environment:
      NODE_ENV: "production"
      BACKEND_ENV: "https://app.aizenbot.com"
      AUTH_URL: "https://app.aizenbot.com"
      NEXTAUTH_URL: "https://app.aizenbot.com"
      NEXT_PUBLIC_SITE_URL: "https://app.aizenbot.com"
      DATABASE_URL: "${DATABASE_URL}"
      AUTH_SECRET: "${AUTH_SECRET}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
      FOLLOW_CRON_SECRET: "${FOLLOW_CRON_SECRET}"
      EVOLUTION_WEBHOOK_SECRET: "${EVOLUTION_WEBHOOK_SECRET}"
      PRISMA_AUTO_RESOLVE_FAILED_OFFICIAL_API_MIGRATION: "true"
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.aizenbot.rule=Host(`app.aizenbot.com`)
        - traefik.http.routers.aizenbot.entrypoints=websecure
        - traefik.http.routers.aizenbot.tls=true
        - traefik.http.routers.aizenbot.tls.certresolver=letsencryptresolver
        - traefik.http.routers.aizenbot.service=aizenbot
        - traefik.http.services.aizenbot.loadbalancer.server.port=3000
        - traefik.http.services.aizenbot.loadbalancer.passHostHeader=true

  aizenbot_follow_cron:
    image: curlimages/curl:8.11.1
    environment:
      FOLLOW_CRON_SECRET: "${FOLLOW_CRON_SECRET}"
      EVOLUTION_WEBHOOK_SECRET: "${EVOLUTION_WEBHOOK_SECRET}"
    command:
      - sh
      - -lc
      - |
        while true; do
          SECRET="$$FOLLOW_CRON_SECRET"
          if [ -z "$$SECRET" ]; then
            SECRET="$$EVOLUTION_WEBHOOK_SECRET"
          fi
          if [ -n "$$SECRET" ]; then
            echo "[follow-cron] calling /api/cron/follows with secret"
            curl -sS -X POST \
              -H "x-follow-cron-secret: $$SECRET" \
              -o /tmp/follow-cron.body \
              -w "[follow-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/follows || true
          else
            echo "[follow-cron] calling /api/cron/follows without secret"
            curl -sS -X POST \
              -o /tmp/follow-cron.body \
              -w "[follow-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/follows || true
          fi
          if [ -f /tmp/follow-cron.body ]; then
            echo "[follow-cron] body:"
            cat /tmp/follow-cron.body
            rm -f /tmp/follow-cron.body
          fi
          sleep 60
        done
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  aizenbot_daily_report_cron:
    image: curlimages/curl:8.11.1
    environment:
      DAILY_REPORT_CRON_SECRET: "${DAILY_REPORT_CRON_SECRET}"
      FOLLOW_CRON_SECRET: "${FOLLOW_CRON_SECRET}"
    command:
      - sh
      - -lc
      - |
        while true; do
          SECRET="$$DAILY_REPORT_CRON_SECRET"
          if [ -z "$$SECRET" ]; then
            SECRET="$$FOLLOW_CRON_SECRET"
          fi
          if [ -n "$$SECRET" ]; then
            echo "[daily-report-cron] calling /api/cron/daily-report with secret"
            curl -sS -X POST \
              -H "x-daily-report-secret: $$SECRET" \
              -o /tmp/daily-report.body \
              -w "[daily-report-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/daily-report || true
          else
            echo "[daily-report-cron] calling /api/cron/daily-report without secret"
            curl -sS -X POST \
              -o /tmp/daily-report.body \
              -w "[daily-report-cron] http_status=%{http_code}\n" \
              https://app.aizenbot.com/api/cron/daily-report || true
          fi
          if [ -f /tmp/daily-report.body ]; then
            echo "[daily-report-cron] body:"
            cat /tmp/daily-report.body
            rm -f /tmp/daily-report.body
          fi
          sleep 60
        done
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # Respaldo nocturno de la base a Google Drive (docker/respaldo/respaldo.sh, ver README). Misma imagen
  # que la app: mira la hora cada minuto y a las 2:00 a. m. de Colombia copia la base (solo lee), la sube
  # a Drive en Respaldos/AizenCRM y borra alli las de mas de 30 dias. Si falla, correo a RESPALDO_AVISO_A.
  aizenbot_respaldo:
    image: ghcr.io/alexmorer/agentelite:latest
    volumes:
      - aizenbot_respaldos:/respaldos
    environment:
      RESPALDO_DATABASE_URL: "${RESPALDO_DATABASE_URL}"
      RESPALDO_AVISO_A: "${RESPALDO_AVISO_A}"
      RCLONE_CONFIG_DRIVE_TYPE: "drive"
      RCLONE_CONFIG_DRIVE_SCOPE: "drive.file"
      RCLONE_CONFIG_DRIVE_TOKEN: "${RCLONE_CONFIG_DRIVE_TOKEN}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_SECURE: "${SMTP_SECURE}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASS}"
      SMTP_FROM: "${SMTP_FROM}"
    command: ["sh", "./docker/respaldo/respaldo.sh", "reloj"]
    networks:
      - minha_rede
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

networks:
  minha_rede:
    external: true

volumes:
  aizenbot_uploads:
  aizenbot_respaldos:
